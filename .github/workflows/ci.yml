name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edu?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/edu_test?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-32chars
      AUTH_PROVIDER: dev
      AI_PROVIDER: mock
      QUEUE_DRIVER: inline
      STORAGE_DRIVER: local
      PAYMENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Каждый коммит диапазона проверяется отдельно: коммит, задевший зоны нескольких
      # владельцев (OWNERS.yaml), должен содержать метку cross-owner в сообщении.
      - name: Ownership check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm ownership:check --base="$PR_BASE" --head="$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            pnpm ownership:check --base="$PUSH_BEFORE" --head="$GITHUB_SHA"
          else
            pnpm ownership:check --base="$GITHUB_SHA~1" --head="$GITHUB_SHA"
          fi
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    # Путь жюри: `docker compose up -d --build` одной командой. Проверяем, что образы собираются
    # (лимит сдачи — 5 минут без учёта базовых образов), api проходит миграции + seed и отвечает
    # с базой, а web отдаёт SPA через nginx. Секреты не нужны: mock-ИИ, dev-вход, fake-платежи.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (compose)
        run: |
          cp .env.example .env
          start=$(date +%s)
          docker compose build
          echo "build took $(( $(date +%s) - start )) s"
      - name: Up and smoke
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"db":"ok"'; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health
          curl -fsS http://127.0.0.1:8080/ | grep -q 'max-web-app.js'
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"maxUserId":"max-student-1","roles":["STUDENT"]}' \
            http://127.0.0.1:8080/api/v1/auth/dev | grep -q accessToken
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color api web | tail -200
      - name: Down
        if: always()
        run: docker compose down -v
