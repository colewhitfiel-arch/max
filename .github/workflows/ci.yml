name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edu?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/edu_test?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-32chars
      AUTH_PROVIDER: dev
      AI_PROVIDER: mock
      QUEUE_DRIVER: inline
      STORAGE_DRIVER: local
      PAYMENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Каждый коммит диапазона проверяется отдельно: коммит, задевший зоны нескольких
      # владельцев (OWNERS.yaml), должен содержать метку cross-owner в сообщении.
      - name: Ownership check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm ownership:check --base="$PR_BASE" --head="$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            pnpm ownership:check --base="$PUSH_BEFORE" --head="$GITHUB_SHA"
          else
            pnpm ownership:check --base="$GITHUB_SHA~1" --head="$GITHUB_SHA"
          fi
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
