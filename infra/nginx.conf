# nginx для runtime-web (см. Dockerfile, стадия runtime-web).
# Один origin для мини-приложения MAX: статика SPA + /api/ проксируется в сервис api.
# Кладётся в /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker. Имя api резолвится в рантайме, а не при старте nginx,
    # иначе контейнер падал бы, если api ещё не поднялся.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Настоящий IP клиента за доверенным прокси (модуль realip). По README «Хостинг» перед
    # стендом стоит TLS-прокси (caddy/nginx/traefik) или ssh-туннель: к nginx он приходит с
    # loopback или из частной сети (шлюз Docker), и клиентом тогда считается последний адрес
    # его X-Forwarded-For, который не из этих диапазонов. Клиент из интернета, пришедший
    # напрямую, доверенным не является — его $remote_addr остаётся как есть.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Лимит из packages/contracts/src/routes/files.ts (BLOCK_MEDIA — 200 МБ).
    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;

    # API: глобальный префикс Nest — /api/v1 (packages/contracts API_PREFIX).
    location /api/ {
        set $api_upstream http://api:3000;
        # При proxy_pass с переменной URI не подставляется автоматически.
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr — клиент (после realip выше). Он дописывается в конец цепочки
        # X-Forwarded-For, и api берёт именно последний адрес (common/rate-limit, clientIp):
        # что бы клиент ни прислал в начале цепочки, лимиты api это не обходит.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # SSE-ручки (стриминг ИИ) не должны буферизоваться.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Хэшированные ассеты Vite — иммутабельны.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker MSW (режим VITE_API_MODE=mock) кэшировать нельзя.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA: любой неизвестный путь отдаёт index.html (роутинг на клиенте).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
